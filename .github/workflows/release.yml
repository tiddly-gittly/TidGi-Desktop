name: Release App

on:
  push:
    tags:
      - "v*.*.*"
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".vscode"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".vscode"

concurrency:
  # Per-branch group so PRs/branches run in parallel without cancelling each other.
  # Same-branch pushes still cancel stale same-branch runs. GitHub Actions usage is
  # well below the limit, so we prefer isolation over aggressive cross-branch cancellation.
  group: release-ci-group-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate macOS release signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in MAC_CERT_BASE64 MAC_CERT_PASSWORD APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required macOS release signing secrets: ${missing[*]}" >&2
            exit 1
          fi

  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: [release-preflight, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
          # Use macos-15 (Intel) for x64 builds to get correct dugite git binaries
          # Note: macos-15 is available from now until August 2027. https://github.com/actions/runner-images/issues/13046
          - os: macos-15-intel
            platform: mac
            arch: x64
          # Use macos-latest (ARM64) for arm64 builds
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-2022
            platform: win
            arch: x64
          # Pin to windows-2022 (VS 17.x / 2022) because windows-latest
          # ships VS 18 (2026 preview) which node-gyp cannot detect.
          # ARM64 cross-compiles via MSVC — no native ARM64 runner needed.
          - os: windows-2022
            platform: win
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          # Node 24.16.0 breaks extract-zip/yauzl, causing Electron packaging to exit 0 with no output.
          node-version: 24.15.0

      # Set up MSVC compiler for native modules: nsfw, better-sqlite3
      - name: Set up MSVC compiler (Windows)
        if: matrix.platform == 'win'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'x64' }}
      # Install C++ build tools for native modules (Linux only)
      # macOS: GitHub Actions runners come with Xcode Command Line Tools pre-installed
      - name: Install build dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # pnpm git deps (e.g. @electron/node-gyp) resolve to git@github.com on Windows CI
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules for Electron (non-Windows)
        if: matrix.platform != 'win'
        run: |
          rm -rf node_modules/better-sqlite3/prebuilds
          pnpm exec electron-rebuild -f -w better-sqlite3,nsfw --arch=${{ matrix.arch }}
      - name: Rebuild native modules for Electron (Windows)
        if: matrix.platform == 'win'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'x64' }}
          rmdir /s /q node_modules\better-sqlite3\prebuilds 2>nul
          pnpm exec electron-rebuild -f -w better-sqlite3,nsfw --arch=${{ matrix.arch }}
      - name: Build plugins
        run: pnpm run build:plugin

      - name: Import macOS Developer ID certificate
        if: matrix.platform == 'mac' && startsWith(github.ref, 'refs/tags/')
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/tidgi-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/tidgi-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$MAC_CERT_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Make ${{ matrix.platform }} (${{ matrix.arch }})
        run: |
          pnpm exec electron-forge make --platform=${{ matrix.platform == 'mac' && 'darwin' || matrix.platform == 'win' && 'win32' || 'linux' }} --arch=${{ matrix.arch }}
        env:
          NODE_ENV: production
          # Increase Node.js heap size to prevent OOM during build
          NODE_OPTIONS: --max-old-space-size=8192
          # macOS specific environment variables
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          MACOS_SIGNING_ENABLED: ${{ matrix.platform == 'mac' && startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          # Windows specific environment variables
          CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CERT || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CERT_PASS || '' }}
          # Common environment variables
          CI: true
          CI_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          # Only need 1 set of analyzer reports (linux x64)
          ANALYZE: ${{ matrix.platform == 'linux' && matrix.arch == 'x64' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Repackage macOS ZIP using ditto to preserve symlinks (cross-zip doesn't preserve symlinks properly on CI) To prevent dugite git binary symlink dereference issues
      - name: Repackage macOS ZIP with ditto
        if: matrix.platform == 'mac'
        run: |
          cd out/make/zip/darwin/${{ matrix.arch }}
          ZIP_FILE=$(ls *.zip | head -1)
          APP_NAME="TidGi.app"
          # Extract the original zip
          unzip -q "$ZIP_FILE" -d temp_extract
          # Remove the original zip
          rm "$ZIP_FILE"
          # Repackage using ditto (preserves symlinks and macOS metadata)
          ditto -ck --keepParent "temp_extract/$APP_NAME" "$ZIP_FILE"
          # Cleanup
          rm -rf temp_extract
          echo "Repackaged $ZIP_FILE with ditto to preserve symlinks"

      - name: Generate and validate release checksums
        run: pnpm exec tsx scripts/generateReleaseChecksums.ts out/make ${{ matrix.platform }} ${{ matrix.arch }} out/make/SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt

      # Upload analyzer reports and packaged apps as workflow artifacts (only linux x64)
      - name: Upload analyzer reports
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: analyzer-reports-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .vite/renderer/bundle-analyzer-renderer.html
            .vite/main/bundle-analyzer-main.html
          if-no-files-found: ignore

      - name: Upload packaged apps
        if: (matrix.platform == 'mac' && matrix.arch == 'x64') || (matrix.platform == 'win' && matrix.arch == 'x64')
        uses: actions/upload-artifact@v7
        with:
          name: packaged-apps-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/**
          if-no-files-found: ignore

      # Create Release (upload artifacts from all builds)
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ matrix.platform == 'win' && 'out/make/**/*.exe
            out/make/**/*.msix
            out/make/**/*.appx
            out/make/SHA256SUMS-*.txt' || 'out/make/**/*' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bundle analysis is handled by Vite configs when ANALYZE=true
